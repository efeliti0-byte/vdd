<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css?family=Nunito:300,400,500" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="empresas_files/styles.692d0f02a346bd5c34a1.css">
<link rel="stylesheet" href="empresas_files/main.0fb89b1a3f17228a70b7.css">
<link rel="stylesheet" href="modal.css?v=22">
<style>html,body{margin:0;height:100%;background:#bbb}</style>
</head><body>
<div class="cdk-overlay-container is-open" id="passModal">
  <div class="cdk-overlay-backdrop cdk-overlay-dark-backdrop cdk-overlay-backdrop-showing"></div>
  <div class="cdk-global-overlay-wrapper" dir="ltr" style="justify-content: center; align-items: center;">
    <div class="cdk-overlay-pane" style="max-width: 80vw; pointer-events: auto; width: 400px; height: auto; position: static;">
      <mat-dialog-container class="mat-dialog-container" role="dialog" style="transform: none;">
        <div class="container">
          <div class="div-main-title"><h3>Ingresa la contraseña de tu Usuario Único</h3></div>
          <form class="text-center" novalidate>
            <div class="row">
              <div class="col s12 m8 l8 xl8 offset-m2 offset-l2 offset-xl2">
                <mat-form-field appearance="fill" class="mat-form-field mat-primary mat-form-field-appearance-fill mat-form-field-can-float mat-form-field-has-label mat-form-field-should-float mat-focused mat-form-field-invalid mat-form-field-hide-placeholder" id="passField">
                  <div class="mat-form-field-wrapper">
                    <div class="mat-form-field-flex">
                      <div class="mat-form-field-infix">
                        <input class="mat-input-element" type="password" id="password">
                        <span class="mat-form-field-label-wrapper">
                          <label class="mat-form-field-label" for="password"><mat-label><span>Contraseña</span></mat-label></label>
                        </span>
                      </div>
                    </div>
                    <div class="mat-form-field-underline"><span class="mat-form-field-ripple"></span></div>
                    <div class="mat-form-field-subscript-wrapper">
                      <mat-error align="end" class="mat-error" role="alert">Contraseña es <strong>requerida</strong></mat-error>
                    </div>
                  </div>
                </mat-form-field>
              </div>
              <div class="button-container">
                <button class="button-margin mat-raised-button mat-accent" disabled><span class="mat-button-wrapper">Continuar</span></button>
                <button class="button-margin mat-raised-button mat-accent" type="button"><span class="mat-button-wrapper">Cancelar</span></button>
              </div>
            </div>
          </form>
        </div>
      </mat-dialog-container>
    </div>
  </div>
</div>
</body></html>
